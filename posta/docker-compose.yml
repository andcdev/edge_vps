# Server di posta della VPS (Stalwart) per listaspesafacile.com e magopdf.com. Vedi README.md.
#
# Avvio:   docker compose up -d       (la rete proxy-posta la crea ../reti.sh)
name: posta

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.24
    container_name: posta-stalwart
    restart: unless-stopped
    environment:
      # Indirizzo pubblico del pannello (/admin, /account), servito dall'edge.
      STALWART_PUBLIC_URL: https://mail.listaspesafacile.com
    # Solo IPv4: su IPv6 Docker passerebbe dal suo proxy e Stalwart vedrebbe il gateway al posto del vero
    # mittente (SPF, liste nere e antispam sbagliati). Il nome mail.* ha solo il record A.
    # Docker apre queste porte da sé, ufw non c'entra.
    ports:
      - "0.0.0.0:25:25"     # posta in arrivo dagli altri server
      - "0.0.0.0:465:465"   # invio da client e app, TLS diretto
      - "0.0.0.0:587:587"   # invio da client e app, STARTTLS
      - "0.0.0.0:993:993"   # IMAP, TLS diretto
    volumes:
      - etc:/etc/stalwart          # solo config.json: dove sta il database
      - dati:/var/lib/stalwart     # impostazioni, caselle, messaggi, chiavi DKIM
      # Certificato di mail.listaspesafacile.com preso dall'edge (Caddy) da certificato.sh.
      - ./tls:/tls:ro
    networks:
      proxy-posta:
        ipv4_address: 10.201.2.10

  # Webmail (Roundcube) su webmail.listaspesafacile.com, servita dall'edge. Captcha Turnstile al login (rcguard).
  webmail:
    build: ./webmail
    image: posta-webmail:1.7.4
    container_name: posta-webmail
    restart: unless-stopped
    depends_on:
      - stalwart
    # TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY, ROUNDCUBEMAIL_DES_KEY: solo sulla VPS (permessi 600).
    env_file: webmail.env
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_PLUGINS: rcguard,archive,zipdownload
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    # IMAP/SMTP verso Stalwart sulla rete interna, con il nome giusto per il certificato.
    extra_hosts:
      - "mail.listaspesafacile.com:10.201.2.10"
    volumes:
      - webmail:/var/roundcube/db
      - ./webmail/config.inc.php:/var/roundcube/config/posta.inc.php:ro
    networks:
      proxy-posta:
        ipv4_address: 10.201.2.20

networks:
  proxy-posta:
    external: true

volumes:
  etc:
  dati:
  webmail:
